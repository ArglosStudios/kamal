service: app_with_single_line_custom_certificate
image: app_with_single_line_custom_certificate
servers:
  web:
    hosts:
      - vm1
      - vm2
  workers:
    hosts:
      - vm3
    cmd: sleep infinity
deploy_timeout: 2
drain_timeout: 2
readiness_delay: 0

proxy:
  host: localhost
  ssl:
    certificate_pem: SINGLE_LINE_CERT_PEM
    private_key_pem: SINGLE_LINE_KEY_PEM
    parse_single_line_certificates: true
  healthcheck:
    interval: 1
    timeout: 1
    path: "/up"

asset_path: /usr/share/nginx/html/versions

registry:
  server: registry:4443
  username: root
  password: root
builder:
  driver: docker
  arch: <%= Kamal::Utils.docker_arch %>
  args:
    COMMIT_SHA: <%= `git rev-parse HEAD` %>
